name: Babel CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: babel-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm --filter @workspace/babel-reading-platform run typecheck
      - run: pnpm --filter @workspace/api-server run typecheck
      - run: pnpm --filter @workspace/babel-reading-platform run build
      - run: pnpm --filter @workspace/api-server run build

        - name: Smoke test production start
          run: |
            set -e
            pnpm start > /tmp/babel-start.log 2>&1 &
            pid=$!
            trap 'kill $pid 2>/dev/null || true' EXIT
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:5000/api/healthz >/dev/null; then
                exit 0
              fi
              sleep 1
            done
            cat /tmp/babel-start.log
            exit 1
